<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Interactive study web app for college medical terminology — word parts, flashcards, quizzes, and 3D anatomy."
    />
    <title>MedTerm · Medical Terminology Study</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>"
    />

    <!-- Three.js loaded as ES modules from a CDN. No build step required, so
         the site deploys to GitHub Pages as-is. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.164.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.164.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon">🩺</span>
        <span class="brand-name">MedTerm</span>
      </div>
      <nav class="app-nav" id="nav">
        <button class="nav-btn" data-view="home">Home</button>
        <button class="nav-btn" data-view="wordparts">Word Parts</button>
        <button class="nav-btn" data-view="flashcards">Flashcards</button>
        <button class="nav-btn" data-view="quiz">Quiz</button>
        <button class="nav-btn" data-view="anatomy">3D Anatomy</button>
      </nav>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">☰</button>
    </header>

    <main id="app" class="app-main"></main>

    <footer class="app-footer">
      <p>
        MedTerm — a study tool for medical terminology.
        Educational use only; not medical advice.
      </p>
    </footer>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
