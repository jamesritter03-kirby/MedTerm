<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Interactive study web app for college medical terminology — word parts, flashcards, quizzes, and 3D anatomy."
    />
    <title>MedTerm · Medical Terminology Study</title>
    <link rel="stylesheet" href="css/styles.css?v=1.3.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>"
    />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon">🩺</span>
        <span class="brand-name">MedTerm</span>
        <span class="brand-version">v1.3.0</span>
      </div>
      <nav class="app-nav" id="nav">
        <button class="nav-btn" data-view="home">Home</button>
        <button class="nav-btn" data-view="wordparts">Word Parts</button>
        <button class="nav-btn" data-view="flashcards">Flashcards</button>
        <button class="nav-btn" data-view="quiz">Quiz</button>
        <button class="nav-btn" data-view="atlas">Atlas</button>
        <button class="nav-btn" data-view="progress">Progress</button>
      </nav>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">☰</button>
    </header>

    <main id="app" class="app-main"></main>

    <footer class="app-footer">
      <p>
        MedTerm — a study tool for medical terminology.
        Educational use only; not medical advice.
      </p>
    </footer>

    <script type="module" src="js/app.js?v=1.3.0"></script>
  </body>
</html>
